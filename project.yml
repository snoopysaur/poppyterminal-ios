name: PoppyTerminal
options:
  bundleIdPrefix: io.github.snoopysaur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  PoppyKit:
    path: Packages/PoppyKit
targets:
  PoppyTerminal:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SwiftTerm
      - package: PoppyKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PoppyTerminal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "O PoppyTerminal confirma que é você antes de aprovar ou enviar ordens aos agentes."
        # Esquema do deep link do push (poppyterminal://inbox/<id>); a S4 implementa o tratamento.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.snoopysaur.poppyterminal
            CFBundleURLSchemes:
              - poppyterminal
        UIAppFonts:
          - JetBrainsMonoNerdFontMono-Regular.ttf
          - JetBrainsMonoNerdFontMono-Bold.ttf
          - JetBrainsMonoNerdFontMono-Italic.ttf
          - JetBrainsMonoNerdFontMono-BoldItalic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    postBuildScripts:
      # E2E: o servidor de teste fala http em 127.0.0.1. O Info.plist e unico por alvo, entao a
      # chave NSAllowsLocalNetworking e acrescentada ao plist JA PRODUZIDO, so na configuracao
      # Debug. Release (archive/IPA) nunca recebe a chave; NSAllowsArbitraryLoads nunca existe.
      - name: ATS local so em Debug (E2E)
        basedOnDependencyAnalysis: false
        # Entrada declarada: o script so roda depois que o Xcode gerou o Info.plist do produto
        # (sem isso ha corrida e o plist sai so com a chave ATS).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.snoopysaur.poppyterminal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  PoppyTerminalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PoppyTerminal
      - package: PoppyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.snoopysaur.poppyterminal.tests
        GENERATE_INFOPLIST_FILE: YES
  PoppyTerminalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PoppyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.snoopysaur.poppyterminal.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PoppyTerminal:
    build:
      targets:
        PoppyTerminal: all
    test:
      targets:
        - PoppyTerminalTests
        - PoppyTerminalUITests
