name: PoppyTerminal
options:
  bundleIdPrefix: io.github.snoopysaur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  PoppyKit:
    path: Packages/PoppyKit
targets:
  PoppyTerminal:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SwiftTerm
      - package: PoppyKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PoppyTerminal
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - JetBrainsMonoNerdFontMono-Regular.ttf
          - JetBrainsMonoNerdFontMono-Bold.ttf
          - JetBrainsMonoNerdFontMono-Italic.ttf
          - JetBrainsMonoNerdFontMono-BoldItalic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.snoopysaur.poppyterminal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PoppyTerminalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PoppyTerminal
      - package: PoppyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.snoopysaur.poppyterminal.tests
        GENERATE_INFOPLIST_FILE: YES
  PoppyTerminalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PoppyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.snoopysaur.poppyterminal.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PoppyTerminal:
    build:
      targets:
        PoppyTerminal: all
    test:
      targets:
        - PoppyTerminalTests
        - PoppyTerminalUITests
